name: Build Sunbeam app


on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff

      - name: Print the changelog
        run: cat "${{ steps.git-cliff.outputs.changelog }}"

  build-tauri:
    # Keep this synchronized with the publish.yml workflow.
    permissions:
      contents: write
    env:
      UV_VERSION: "0.9.9"
    strategy:
      fail-fast: false
      matrix:
        include:
          # for Universal macOS builds (arm64 and x86_64)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Download uv and create universal binary for macos
        if: runner.os == 'macOS'
        run: |
          mkdir -p ./src-tauri/binaries
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-aarch64-apple-darwin.tar.gz
          tar tvf uv-aarch64-apple-darwin.tar.gz
          tar xf uv-aarch64-apple-darwin.tar.gz uv-aarch64-apple-darwin/uv
          mv uv-aarch64-apple-darwin/uv ./src-tauri/binaries/uv-aarch64-apple-darwin
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-apple-darwin.tar.gz
          tar tvf uv-x86_64-apple-darwin.tar.gz
          tar xf uv-x86_64-apple-darwin.tar.gz uv-x86_64-apple-darwin/uv
          mv uv-x86_64-apple-darwin/uv ./src-tauri/binaries/uv-x86_64-apple-darwin
          # create universal binary
          lipo -create ./src-tauri/binaries/uv-aarch64-apple-darwin ./src-tauri/binaries/uv-x86_64-apple-darwin -output ./src-tauri/binaries/uv-universal-apple-darwin
      - name: Download uv for x86_64 windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ./src-tauri/binaries
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-pc-windows-msvc.zip
          7z l uv-x86_64-pc-windows-msvc.zip
          7z e uv-x86_64-pc-windows-msvc.zip uv.exe
          mv uv.exe ./src-tauri/binaries/uv-x86_64-pc-windows-msvc.exe
      - name: Download uv for x86_64 linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p ./src-tauri/binaries
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz
          tar tvf uv-x86_64-unknown-linux-gnu.tar.gz
          tar xf uv-x86_64-unknown-linux-gnu.tar.gz uv-x86_64-unknown-linux-gnu/uv
          mv uv-x86_64-unknown-linux-gnu/uv ./src-tauri/binaries/uv-x86_64-unknown-linux-gnu
      - name: Install system packages (linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install libglib2.0-dev libwayland-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Setup tauri project
        run: |
          npm install
      - name: Install rust for x86_64 on macOS
        if: matrix.args == '--target universal-apple-darwin'
        run: |
          rustup target add x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
