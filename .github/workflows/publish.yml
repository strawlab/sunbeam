name: Publish Sunbeam app

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  generate-changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: latest
          args: -vv --latest --no-exec --github-repo ${{ github.repository }} --tag-pattern "v.*" --github-token ${{ github.token }}

  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: generate-changelog
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: create release
        id: create-release
        uses: actions/github-script@v9
        env:
          RELEASE_BODY: ${{ needs.generate-changelog.outputs.release_body }}
        with:
          script: |
            const releaseBody = process.env.RELEASE_BODY;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              name: `Sunbeam v${process.env.PACKAGE_VERSION}`,
              body: releaseBody,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    # Keep this synchronized with the build.yml workflow.
    needs: create-release
    permissions:
      contents: write
    env:
      UV_VERSION: "0.11.25"
    strategy:
      fail-fast: false
      matrix:
        include:
          # for Universal macOS builds (arm64 and x86_64)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Download uv and create universal binary for macos
        if: runner.os == 'macOS'
        run: |
          mkdir -p ./src-tauri/binaries
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-aarch64-apple-darwin.tar.gz
          tar tvf uv-aarch64-apple-darwin.tar.gz
          tar xf uv-aarch64-apple-darwin.tar.gz uv-aarch64-apple-darwin/uv
          mv uv-aarch64-apple-darwin/uv ./src-tauri/binaries/uv-aarch64-apple-darwin
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-apple-darwin.tar.gz
          tar tvf uv-x86_64-apple-darwin.tar.gz
          tar xf uv-x86_64-apple-darwin.tar.gz uv-x86_64-apple-darwin/uv
          mv uv-x86_64-apple-darwin/uv ./src-tauri/binaries/uv-x86_64-apple-darwin
          # create universal binary
          lipo -create ./src-tauri/binaries/uv-aarch64-apple-darwin ./src-tauri/binaries/uv-x86_64-apple-darwin -output ./src-tauri/binaries/uv-universal-apple-darwin
      - name: Download uv for x86_64 windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ./src-tauri/binaries
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-pc-windows-msvc.zip
          7z l uv-x86_64-pc-windows-msvc.zip
          7z e uv-x86_64-pc-windows-msvc.zip uv.exe
          mv uv.exe ./src-tauri/binaries/uv-x86_64-pc-windows-msvc.exe
      - name: Download uv for x86_64 linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p ./src-tauri/binaries
          curl --remote-name --location https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz
          tar tvf uv-x86_64-unknown-linux-gnu.tar.gz
          tar xf uv-x86_64-unknown-linux-gnu.tar.gz uv-x86_64-unknown-linux-gnu/uv
          mv uv-x86_64-unknown-linux-gnu/uv ./src-tauri/binaries/uv-x86_64-unknown-linux-gnu
      - name: Install system packages (linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libwayland-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Setup tauri project
        run: |
          npm install
      - name: Install rust for x86_64 on macOS
        if: matrix.args == '--target universal-apple-darwin'
        run: |
          rustup target add x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: publish release
        id: publish-release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })